[project]
name = "rn_cwt"
version = "0.1.0"
description = "Weakly-nonlinear mode coupling for a charged scalar on near-extremal Reissner-Nordström"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "pandas",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
